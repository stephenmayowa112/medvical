    "email": "info@medvical.com",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "44 Boundary Road, GRA",

    "geo": {
      "@type": "GeoCoordinates",

      { "@type": "MedicalProcedure", "name": "Pharmacy Services" }
    ],
    "sameAs": []

      },
      {
        "@type": "Question",

          "@type": "Answer",
          "text": "Our fully equipped laboratory in Benin City provides fast, accurate and affordable diagnostic services."
        }
      },
      {
        "@type": "Question",
        "name": "Do you accept insurance and HMO?",
